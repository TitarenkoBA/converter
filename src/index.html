<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Converter</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Convert images between PNG, JPG, WebP, HEIC, AVIF, SVG, ICO and BMP right in your browser. Private and works offline." />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Apply the saved theme before first paint (key must match ThemeService). -->
    <script>
      try {
        var t = localStorage.getItem('converter.theme');
        var d = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to convert images.</noscript>
  </body>
</html>
